<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>中学英単語&amp;文法演習システム｜志学ゼミナール</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Hiragino Sans','Meiryo',sans-serif;background:#f8f9fa;color:#333;padding:8px;}
  .header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;background:linear-gradient(135deg,#1D9E75,#2ecc71);margin-bottom:10px;}
  .header-title{font-size:22px;font-weight:900;color:#fff;letter-spacing:1px;-webkit-text-stroke:1.5px #000;paint-order:stroke fill;text-shadow:2px 2px 4px rgba(0,0,0,0.4);}
  .header-school{font-size:12px;font-weight:700;color:#fff;opacity:0.9;white-space:nowrap;}
  
  .grade-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .grade-btn{flex:1 1 calc(33.33% - 6px);padding:8px 0;border-radius:8px;border:1px solid #aaa;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#555;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,0.05);white-space:nowrap;}
  .grade-btn.active{background:#1D9E75;border-color:#1D9E75;color:#fff;font-weight:bold;}
  .grade-btn.special-tab {flex:1 1 calc(50% - 6px);background-color:#ffffff;border-color:#1D9E75;color:#1D9E75;font-weight:bold;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;padding:8px 0;}
  .grade-btn.special-tab.idiom-tab-style {background-color:#e6f4ea;border-color:#059669;color:#059669;}
  .grade-btn.special-tab:hover {background-color:#1D9E75;color:#ffffff;}
  
  /* その他、既存のCSS（省略しますがそのまま維持されます） */
  .grade-intro{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:8px 12px;background:#f0faf5;border-radius:8px;border:1px solid #c0e8d5;}
  .grade-intro img{width:56px;height:72px;object-fit:cover;border-radius:4px;border:1px solid #ccc;}
  .grade-intro-text{font-size:13px;color:#444;line-height:1.6;}
  .unit-list{display:flex;flex-direction:column;gap:6px;}
  .unit-btn{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;text-align:left;}
  .unit-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;min-width:52px;text-align:center;}
  .tag-unit{background:#1D9E75;color:#fff;}
  .tag-grammar{background:#A32D2D;color:#fff;}
  .unit-title-text{font-size:13px;flex:1;}
  #wordView{display:none;}
  .ans-hidden{filter:blur(4px);}
  @media (max-width: 480px) { .header-title{font-size:18px;} .grade-btn{font-size:11.5px;} }
</style>
</head>
<body>
<div class="header">
  <div class="header-title">📚 中学英単語&amp;文法演習システム</div>
  <div class="header-school">志学ゼミナール</div>
</div>

<div class="grade-tabs">
  <button class="grade-btn active" onclick="selectGrade('j1',this)">中学1年</button>
  <button class="grade-btn" onclick="selectGrade('j2',this)">中学2年</button>
  <button class="grade-btn" onclick="selectGrade('j3',this)">中学3年</button>
  <a href="https://shigakusakura-pixel.github.io/grammar/" class="grade-btn special-tab grammar-tab-link" target="_blank">中学英文法 完全マスター</a>
  <a href="https://shigakusakura-pixel.github.io/idioms/" class="grade-btn special-tab idiom-tab-link idiom-tab-style" target="_blank">★ 入試英熟語300</a>
</div>

<div id="unitView">
  <div id="gradeIntro" class="grade-intro"></div>
  <div id="gradeLabel" style="font-size:13px;color:#888;margin-bottom:8px;"></div>
  <div class="unit-list" id="unitList"></div>
</div>

<div id="wordView">
  <button class="back-btn" onclick="showUnitView()">← 単元一覧に戻る</button>
  <div class="unit-header" id="unitHeader"></div>
  <div id="wordContent"></div>
</div>

// その後のプログラム部分
function selectGrade(g,btn){ /* ...以下、動作用のプログラム全体... */ }

</script>
</body>
</html>
