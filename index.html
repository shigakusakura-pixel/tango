<style>
  *{box-sizing:border-box;margin:0;padding:0;}

  .header-title{font-size:22px;font-weight:900;color:#fff;letter-spacing:1px;-webkit-text-stroke:1.5px #000;paint-order:stroke fill;text-shadow:2px 2px 4px rgba(0,0,0,0.4);}
  .grade-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .grade-btn{flex:1 1 calc(33.33% - 6px);padding:8px 0;border-radius:8px;border:1px solid #aaa;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#555;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,0.05);}
  .grade-btn.active{background:#1D9E75;color:#fff;font-weight:bold;}
  .special-tab{flex:1 1 calc(50% - 6px);background-color:#ffffff;border:1px solid #1D9E75;color:#1D9E75;font-weight:bold;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;padding:8px 0;border-radius:8px;font-size:12px;}
  .idiom-tab-style{background-color:#e6f4ea;border-color:#059669;color:#059669;}
  .grade-intro{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:8px 12px;background:#f0faf5;border-radius:8px;border:1px solid #c0e8d5;}
  .unit-btn{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;text-align:left;margin-bottom:6px;width:100%;}
  #wordView{display:none;}
  .ans-hidden{filter:blur(4px);user-select:none;cursor:pointer;}
  .ans-visible{filter:none;}
  .speak-btn{background:#fff;border:1px solid #ccc;border-radius:5px;padding:3px 7px;}
  .speak-btn.playing{background:#e8f0fb;}
  .count-badge{font-size:11px;background:#eee;color:#666;border-radius:10px;padding:1px 8px;}
  .empty-badge{font-size:11px;background:#fff3cd;color:#856404;border-radius:10px;padding:1px 8px;}
  .unit-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;min-width:52px;text-align:center;color:#fff;}
  .tag-unit{background:#1D9E75;}
  .tag-grammar{background:#A32D2D;}
  .tag-stage{background:#185FA5;}
  .tag-smalltalk{background:#854F0B;}
  .unit-title-text{font-size:13px;flex:1;}
  .ctrl-bar{display:flex;gap:6px;margin-bottom:10px;}
  .ctrl-btn{background:#fff;border:1px solid #ccc;border-radius:7px;padding:4px 12px;font-size:12px;cursor:pointer;}
  .ctrl-btn.active{border-color:#378ADD;color:#185FA5;background:#e8f0fb;}
  .all-ans-bar,.retry-bar{display:flex;gap:8px;margin-bottom:8px;align-items:center;font-size:12px;color:#888;}
  .all-ans-btn{background:#fff;border:1px solid #1D9E75;border-radius:7px;padding:4px 12px;font-size:12px;color:#1D9E75;cursor:pointer;}
  .retry-btn{background:#fff;border:1px solid #E24B4A;border-radius:7px;padding:4px 12px;font-size:12px;color:#E24B4A;cursor:pointer;}
  .score-badge{font-size:12px;background:#e8f0fb;color:#185FA5;padding:2px 10px;border-radius:10px;}
  .search-box{padding:6px 10px;font-size:13px;border:1px solid #ccc;border-radius:7px;width:100%;margin-bottom:8px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:7px 10px;border-bottom:1px solid #eee;text-align:left;}
  .row-even td{background:#f0faf5;}
  .row-odd td{background:#fff;}
  .row-ok td{background:#f0fff4 !important;opacity:0.6;}
  .row-miss td{background:#fff0f0 !important;}
  .check-btn{border:none;border-radius:5px;padding:3px 8px;font-weight:700;cursor:pointer;margin-left:2px;}
  .ok-btn{background:#d4edda;color:#155724;}
  .miss-btn{background:#f8d7da;color:#721c24;}
  .toggle-ans-btn{background:#fff;border:1px solid #ccc;border-radius:5px;padding:2px 7px;font-size:11px;color:#555;cursor:pointer;}
  .tip{font-size:11px;background:#e8f0fb;color:#185FA5;border-radius:4px;padding:1px 6px;display:inline-block;margin-top:2px;}
</style>
</head>

    units:[

      {tag:"unit",label:"UNIT 1",title:"What Can We Experience on a Trip?",words:j2_u01},
      {tag:"grammar",label:"文法1",title:"5つの文構造",words:g_j2_1},
      {tag:"unit",label:"UNIT 2",title:"What is Local Food?",words:j2_u2},
      {tag:"grammar",label:"文法2",title:"接続詞",words:g_j2_2},
      {tag:"unit",label:"UNIT 3",title:"What Kind of Job Are You Interested In?",words:j2_u3},
      {tag:"grammar",label:"文法3",title:"不定詞",words:g_j2_3},
      {tag:"stage",label:"Stage 1",title:"Message to Myself in the future",words:j2_stage1},
      {tag:"unit",label:"UNIT 4",title:"What Is Important in a Homestay?",words:j2_u4},
      {tag:"grammar",label:"文法4練習",title:"助動詞",words:j2_grammar4},
      {tag:"unit",label:"UNIT 5",title:"What Design Is Good for Everyone?",words:j2_u5},
      {tag:"unit",label:"UNIT 6",title:"How Can We Make a Good Presentation?",words:j2_u6},
      {tag:"grammar",label:"文法5練習",title:"比較表現",words:j2_grammar5},
      {tag:"unit",label:"UNIT 7",title:"What Are World Heritage Sites and Their Problems?",words:j2_u7},
      {tag:"grammar",label:"文法6練習",title:"受け身",words:j2_grammar6},
    ]
  },
  j3:{
    label:"中学3年",
    units:[
      {tag:"unit",label:"UNIT 0",title:"単語量少ないためUNIT1共用",words:j3_w50},
      {tag:"unit",label:"UNIT 1",title:"What is special about Japanese pop culture",words:j3_w50},
      {tag:"unit",label:"UNIT 2",title:"How do you choose your clothes",words:j3_u2},
      {tag:"grammar",label:"文法1",title:"現在完了と現在完了進行形",words:g_j3_1},
      {tag:"unit",label:"UNIT 3",title:"How can we save animals",words:j3_u3},
      {tag:"grammar",label:"文法2",title:"不定詞",words:j3_grammar2},
      {tag:"unit",label:"UNIT 4",title:"How can we help each other in a disaster",words:j3_u4},
      {tag:"unit",label:"UNIT 5",title:"What makes a good leader",words:j3_u5},
      {tag:"grammar",label:"文法3練習",title:"後置修飾",words:j3_grammar3},
      {tag:"unit",label:"UNIT 6",title:"What does it mean to be a global citizen?",words:j3_u6},

let currentGrade='j1', currentWords=[], speed=1.0, allTimer=null, allIdx=-1, filtered=[], speechSession=0;
const COVER_IMGS = {
  "j1": "https://raw.githubusercontent.com/shigakusakura-pixel/tango/main/NewHorizon1.jpg",
  "j2": "https://raw.githubusercontent.com/shigakusakura-pixel/tango/main/NewHorizon2.jpg",
  "j3": "https://raw.githubusercontent.com/shigakusakura-pixel/tango/main/NewHorizon3.jpg"
};

function selectGrade(g,btn){
  currentGrade=g;
  document.querySelectorAll('.grade-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  showUnitView();
}

function renderUnits(g){
  const ul=document.getElementById('unitList');
  ul.innerHTML='';
  document.getElementById('gradeLabel').textContent=db[g].label+' の単元一覧';
  const gi=document.getElementById('gradeIntro');
  gi.innerHTML='<img src="'+COVER_IMGS[g]+'" alt="'+db[g].label+'" style="width:56px;height:72px;object-fit:cover;border-radius:4px;border:1px solid #ccc;">'
    +'<div class="grade-intro-text"><strong>'+db[g].label+'</strong><br>NEW HORIZON English Course<br>各単元をタップして単語を学習できます。</div>';
  db[g].units.forEach((u,i)=>{
    const btn=document.createElement('button');
    btn.className='unit-btn';
    let tc='tag-unit';
    if(u.tag==='grammar') tc='tag-grammar';
    else if(u.tag==='stage') tc='tag-stage';
    else if(u.tag==='smalltalk') tc='tag-smalltalk';
    const countLabel=u.tag==='grammar'?'問':'語';
    const badge=u.words.length>0 ? `<span class="count-badge">${u.words.length}${countLabel}</span>` : `<span class="empty-badge">準備中</span>`;
    btn.innerHTML=`<span class="unit-tag ${tc}">${u.label}</span><span class="unit-title-text">${u.title}</span>${badge}`;
    btn.onclick=()=>openUnit(g,i);
    ul.appendChild(btn);
  });
}

function toggleAns(i){
  const el=document.getElementById('ans-'+i);
  if(!el)return;
  el.classList.toggle('ans-hidden');
  el.classList.toggle('ans-visible');
  const btn=document.getElementById('abtn-'+i);
  if(btn) btn.textContent=el.classList.contains('ans-visible')?'隠す':'見る';
}

function toggleEnglish(i){
  const el=document.getElementById('english-'+i);
  const btn=document.getElementById('ebtn-'+i);
  if(!el||!btn)return;
  const hidden=el.classList.toggle('ans-hidden');
  el.classList.toggle('ans-visible',!hidden);
  btn.textContent=hidden?'見る':'隠す';
  btn.setAttribute('aria-expanded',String(!hidden));
}

function setAllEnglish(visible){
  document.querySelectorAll('[id^="english-"]').forEach(el=>{
    el.classList.toggle('ans-hidden',!visible);
    el.classList.toggle('ans-visible',visible);
  });
  document.querySelectorAll('[id^="ebtn-"]').forEach(btn=>{
    btn.textContent=visible?'隠す':'見る';
    btn.setAttribute('aria-expanded',String(visible));
  });
}

function showAllAns(){
  document.querySelectorAll('[id^="ans-"].ans-hidden').forEach(el=>{
    el.classList.remove('ans-hidden');el.classList.add('ans-visible');
  });
  document.querySelectorAll('[id^="abtn-"]').forEach(btn=>btn.textContent='隠す');
}

function hideAllAns(){
  document.querySelectorAll('[id^="ans-"].ans-visible').forEach(el=>{
    el.classList.remove('ans-visible');el.classList.add('ans-hidden');
  });
  document.querySelectorAll('[id^="abtn-"]').forEach(btn=>btn.textContent='見る');
}

let missedIndices=[];
function markOk(i){
  const tr=document.getElementById('row-'+i);
  if(!tr)return;
  tr.classList.remove('row-miss'); tr.classList.add('row-ok');
  missedIndices=missedIndices.filter(x=>x!==i);
  updateScore();

  // Firebaseへ記録送信
  if (window.sendLearningRecord && currentWords[i]) {
    const unitTitle = document.getElementById('unitHeader')?.textContent || '英単語';
    window.sendLearningRecord(unitTitle, currentWords[i].en + ' (正解)');
  }
}

function markMiss(i){
  const tr=document.getElementById('row-'+i);
  if(!tr)return;
  tr.classList.remove('row-ok'); tr.classList.add('row-miss');
  if(!missedIndices.includes(i)) missedIndices.push(i);
  updateScore();

  // Firebaseへ記録送信
  if (window.sendLearningRecord && currentWords[i]) {
    const unitTitle = document.getElementById('unitHeader')?.textContent || '英単語';
    window.sendLearningRecord(unitTitle, currentWords[i].en + ' (ミス)');
  }
}

function updateScore(){
  const ok = document.querySelectorAll('tr.row-ok').length;
  const miss = document.querySelectorAll('tr.row-miss').length;
  const total = currentWords.length;
  const sb = document.getElementById('scoreBadge');
  if (sb) { sb.textContent = `正解: ${ok} / ミス: ${miss} (全${total}問)`; }
}

function openUnit(g,i){
  stopAll();
  const u=db[g].units[i];
  currentWords=u.words;
  filtered=currentWords.map((_,j)=>j);
  missedIndices=[];
  const isGrammar=u.tag==='grammar';
  const hasExercises=currentWords.some(w=>w.exercise);
  const unitLabel=isGrammar?'問':'語';
  document.getElementById('unitHeader').textContent=u.label+'：'+u.title+(u.words.length>0?' （'+u.words.length+unitLabel+'）':'');
  document.getElementById('unitView').style.display='none';
  document.getElementById('wordView').style.display='block';
  const wc=document.getElementById('wordContent');
  if(!currentWords.length){
    wc.innerHTML='<div class="empty-msg">この単元のデータはまだ準備中です。</div>';
    return;
  }
  wc.innerHTML=`
    <div class="ctrl-bar">
      <button class="ctrl-btn" id="slowBtn" onclick="setSpeed(0.75)">ゆっくり</button>
      <button class="ctrl-btn active" id="normalBtn" onclick="setSpeed(1.0)">ふつう</button>
      <button class="ctrl-btn" onclick="speakAll()">▶ 全部聴く</button>
      <button class="ctrl-btn" onclick="stopAll()">■ 停止</button>
    </div>
    ${isGrammar ? '<div class="all-ans-bar">'+(hasExercises?'英文・解答：':'英文：')+'<button class="all-ans-btn" onclick="setAllEnglish(true)">全部見せる</button><button class="all-ans-btn" onclick="setAllEnglish(false)">全部隠す</button></div>' : ''}
    <div class="all-ans-bar">
      ${hasExercises?'問題：':'日本語訳：'}
      <button class="all-ans-btn" onclick="showAllAns()">全部見せる</button>
      <button class="all-ans-btn" onclick="hideAllAns()">全部隠す</button>
    </div>
    <div class="retry-bar">
      <span id="scoreBadge" class="score-badge">採点結果がここに表示されます</span>
    </div>
    <input class="search-box" id="searchBox" placeholder="🔍 検索..." oninput="filterTable()">
    <table>
      <thead><tr><th>#</th><th></th><th>${hasExercises?'英文・解答・発音':'英語・発音'}</th><th>${hasExercises?'問題':'日本語'}</th><th>採点</th></tr></thead>
      <tbody id="wordTable"></tbody>
    </table>`;
  renderRows(isGrammar);
  setSpeed(speed);
  updateScore();
}

function renderRows(isGrammar){
  const tb=document.getElementById('wordTable');
  if(!tb)return;
  tb.innerHTML='';
  currentWords.forEach((w,i)=>{
    const tr=document.createElement('tr');
    tr.id='row-'+i;
    tr.className=i%2===0?'row-even':'row-odd';
    tr.innerHTML='<td style="color:#aaa;font-size:12px;">'+(i+1)+'</td>'
      +'<td><button class="speak-btn" data-wi="'+i+'" onclick="speakWord('+i+',this)">🔊</button></td>'
      +'<td>'+(isGrammar?'<div id="english-'+i+'" class="'+(w.exercise?'ans-hidden':'ans-visible')+'">':'<div>')+'<span style="font-weight:600;font-size:14px;">'+w.en+'</span><br><span style="font-size:12px;color:#888;">'+(w.kana||'')+'</span><div class="tip">'+(w.tip||'')+'</div></div>'+(isGrammar?' <button id="ebtn-'+i+'" class="toggle-ans-btn" aria-label="英文 '+(i+1)+' の表示切替" aria-controls="english-'+i+'" aria-expanded="'+(!w.exercise)+'" onclick="toggleEnglish('+i+')">'+(w.exercise?'見る':'隠す')+'</button>':'')+'</td>'
      +'<td><span id="ans-'+i+'" class="'+(w.exercise?'ans-visible':'ans-hidden')+'" onclick="toggleAns('+i+')" style="font-size:12px;color:#555;display:inline-block;">'+w.ja+'</span> <button id="abtn-'+i+'" class="toggle-ans-btn" onclick="toggleAns('+i+')">'+(w.exercise?'隠す':'見る')+'</button></td>'
      +'<td><button class="check-btn ok-btn" onclick="markOk('+i+')">✅</button><button class="check-btn miss-btn" onclick="markMiss('+i+')">❌</button></td>';
    tb.appendChild(tr);
  });
}

function filterTable(){
  stopAll();
  const q=document.getElementById('searchBox').value.toLowerCase();
  filtered=[];let c=0;
  currentWords.forEach((w,i)=>{
    const r=document.getElementById('row-'+i);
    const m=!q||w.en.toLowerCase().includes(q)||(w.ja&&w.ja.toLowerCase().includes(q));
    if(r)r.style.display=m?'':'none';
    if(m){filtered.push(i);c++;}
  });
}

function showUnitView(){
  stopAll();
  document.getElementById('wordView').style.display='none';
  document.getElementById('unitView').style.display='block';
  renderUnits(currentGrade);
}

function setSpeed(s){
  speed=s;
  const slowBtn=document.getElementById('slowBtn');
  const normalBtn=document.getElementById('normalBtn');
  if(slowBtn) slowBtn.classList.toggle('active',s===0.75);
  if(normalBtn) normalBtn.classList.toggle('active',s===1.0);
}
function speakWord(i,btn){
  stopAll();
  if(currentWords[i]) speakEnglish(currentWords[i].speech||currentWords[i].en,btn);
}
function speakEnglish(text,btn,onDone){
  if(!window.speechSynthesis){ if(onDone)onDone(); return; }
  document.querySelectorAll('.speak-btn.playing').forEach(b=>b.classList.remove('playing'));
  if(btn)btn.classList.add('playing');
  const session=speechSession;
  let finished=false;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';
  u.rate=speed;
  const finish=()=>{
    if(finished||session!==speechSession)return;
    finished=true;
    if(btn)btn.classList.remove('playing');
    if(onDone)onDone();
  };
  u.onend=finish;
  u.onerror=finish;
  window.speechSynthesis.speak(u);
}
function speakAll(){
  stopAll();
  allIdx=0;
  speakNext();
}
function speakNext(){
  if(allIdx<0||allIdx>=filtered.length){ allIdx=-1; return; }
  const wi=filtered[allIdx];
  const w=currentWords[wi];
  if(!w){ allIdx++; speakNext(); return; }
  const btn=document.querySelector('[data-wi="'+wi+'"]');
  speakEnglish(w.speech||w.en,btn,()=>{ if(allIdx>=0){ allIdx++; speakNext(); } });
}
function stopAll(){
  speechSession++;
  allIdx=-1;
  if(window.speechSynthesis)window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn.playing').forEach(b=>b.classList.remove('playing'));
}

showUnitView();
</script>
<script type="module" src="./mystudy.js"></script>
